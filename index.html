<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>After-School Lessons</title>

    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .activity-board {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .course-tile {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            width: 220px;
            box-sizing: border-box;
        }

        .course-tile i {
            font-size: 30px;
            color: #285a8e;
        }

        .course-tile h2 {
            font-size: 20px;
        }

        [v-cloak] {
            display: none;
        }

        @media (max-width: 550px) {
            .course-tile {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="app" v-cloak>

        <h1>{{ sitename }}</h1>

        <p>Choose an after-school lesson.</p>

        <div class="activity-board">

            <!-- Display one card for each lesson. -->
            <div
                class="course-tile"
                v-for="lesson in lessons"
                :key="lesson.id">

                <i :class="lesson.icon" aria-hidden="true"></i>

                <h2>{{ lesson.subject }}</h2>

                <p>Location: {{ lesson.location }}</p>

                <p>Price: {{ lesson.price }} AED</p>

                <p>Spaces: {{ lesson.spaces }}</p>

            </div>

        </div>

    </div>

    <script>
        let app = new Vue({
            el: "#app",

            data: {
                sitename: "After-School Lessons",

                lessons: [
    {
        id: 1,
        subject: "Mathematics",

        price: 80,
        spaces: 5,
        icon: "fas fa-calculator"
    },

        price: 65,

    },
    {

    },
    {
        id: 6,

        spaces: 5,

    },
    {

    </script>

</body>
</html>
